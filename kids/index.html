 background:#fbfdff;color:#1e2a3a;resize:vertical;-webkit-user-select:text;user-select:text;direction:rtl}

.btns{display:flex;gap:1rem;margin-top:.9rem}

.big:active{transform:scale(.97)}.save{background:#27ae60;color:#fff}.read{background:#5b8def;color:#fff}

.yes{background:#eb5757;color:#fff}.no{background:#e3e6ef;color:#1e2a3a}

<div id="app">
 <div id="day" class="view">

  </div>
 </div>

</div>

<div id="alert" class="hidden"><div class="run">🏃</div><div class="at">צריך להתחיל למהר!</div><div class="as" id="alsub"></div>
 <button class="snd hidden" id="snd2">הפעל צליל 🔔</button><button class="ok" id="dismiss">אני בדרך! ✋</button></div>
<script>
(function(){
"use strict";
// ================= WRITING AREA → GOOGLE SHEET (same write-only Apps Script web app as Ben; kid:"noam" → "היומן של נועם") =================
var DIARY_ENDPOINT = "https://script.google.com/macros/s/AKfycbwijY_uMoVurCDfsgYe0QYST0CEUdnr5VNAxmf-FLuR6TQY61j-Yly9vASkkiXU5Q4Fdw/exec";
// Morning alert (Munich time, school days only): countdown from ALERT_AT-WARN_MIN, full-screen alert at ALERT_AT until "אני בדרך!".
var ALERT_AT = "07:15", WARN_MIN = 5;
var TZ="Europe/Berlin", LAT=48.137, LON=11.575;
var HEB_DAYS=["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"]; // JS getDay order
var HEB_MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
var WMO={0:["☀️","שמש"],1:["🌤️","בעיקר שמש"],2:["⛅","מעונן חלקית"],3:["☁️","מעונן"],45:["🌫️","ערפל"],48:["🌫️","ערפל קפוא"],
 51:["🌦️","טפטוף קל"],53:["🌦️","טפטוף"],55:["🌧️","טפטוף חזק"],56:["🌧️","טפטוף קפוא"],57:["🌧️","טפטוף קפוא"],61:["🌧️","גשם קל"],
 63:["🌧️","גשם"],65:["🌧️","גשם חזק"],66:["🌨️","גשם קפוא"],67:["🌨️","גשם קפוא"],71:["🌨️","שלג קל"],73:["❄️","שלג"],75:["❄️","שלג כבד"],
 77:["🌨️","פתיתי שלג"],80:["🌦️","ממטרים קלים"],81:["🌧️","ממטרים"],82:["⛈️","ממטרים חזקים"],85:["🌨️","ממטרי שלג"],86:["❄️","ממטרי שלג חזקים"],
 95:["⛈️","סופת רעמים"],96:["⛈️","סופת רעמים וברד"],99:["⛈️","סופת רעמים וברד"]};
var SNOW=[71,73,75,77,85,86];

// ---- time (always Munich wall-clock; ?now=YYYY-MM-DDTHH:MM simulates a Munich time for testing) ----
var q=new URLSearchParams(location.search), simOffset=0;
var fmt=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function munichParts(ms){var o={};fmt.formatToParts(new Date(ms)).forEach(function(p){o[p.type]=p.value;});
 if(o.hour==="24")o.hour="00";return {date:o.year+"-"+o.month+"-"+o.day,h:+o.hour,m:+o.minute,s:+o.second};}
if(q.get("now")){ // treat as Munich wall time: find the UTC ms that shows that wall time
 var w=q.get("now"), guess=Date.parse(w+":00Z"); var p=munichParts(guess);
 var diff=(Date.parse(p.date+"T"+pad(p.h)+":"+pad(p.m)+":00Z")-guess); simOffset=guess-diff-Date.now();}
function nowMs(){return Date.now()+simOffset;}
function now(){return munichParts(nowMs());}
function pad(n){return (n<10?"0":"")+n;}
function hm(min){min=((min%1440)+1440)%1440;return pad(Math.floor(min/60))+":"+pad(min%60);}
function toMin(s){var a=s.split(":");return +a[0]*60+ +a[1];}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function dObj(iso){var a=iso.split("-");return new Date(Date.UTC(+a[0],a[1]-1,+a[2]));}
function addDays(iso,n){var d=dObj(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function dateTxt(iso){var d=dObj(iso);return HEB_DAYS[d.getUTCDay()]+", "+d.getUTCDate()+" ב"+HEB_MONTHS[d.getUTCMonth()];}

// ---- noam.json, Noam-only subset of data.json (every 5 min, cache-busted; last good copy kept for offline) ----
var DATA=null, WXSTAT="טוען…", BUILD="noam v3 03.11", WX={}, WEEKWX=null, lastDate=null, view="day";
try{DATA=JSON.parse(localStorage.getItem("kb-noam-data")||"null");}catch(e){}
function loadData(){
 return fetch("noam.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json();})
 .then(function(j){DATA=j;try{localStorage.setItem("kb-noam-data",JSON.stringify(j));}catch(e){}render();})
 .catch(function(){render();});
}
function dayData(iso){if(!DATA)return null;for(var i=0;i<DATA.days.length;i++)if(DATA.days[i].date===iso)return DATA.days[i];return null;}
function travel(){return (DATA&&DATA.travel_minutes)||15;}

// ---- weather (live Open-Meteo; on failure show nothing) ----
function loadWeather(iso){
 var url="https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
  "&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code"+
  "&timezone=Europe%2FBerlin&start_date="+iso+"&end_date="+iso;
 var ctl=window.AbortController?new AbortController():null; if(ctl)setTimeout(function(){ctl.abort();},12000);
 return fetch(url,ctl?{signal:ctl.signal,cache:"no-store"}:{cache:"no-store"}).then(function(r){if(!r.ok)throw r.status;return r.json();}).then(function(j){
  var h=j.hourly, rows=h.time.map(function(t,i){return {hour:+t.slice(11,13),temp:h.temperature_2m[i],feels:h.apparent_temperature[i],

  h+='<div class="entry"><div class="row2"><div class="bd"><div class="when">🗓️ '+esc(stampTxt(e.ts))+'</div><div class="txt">'+esc(e.txt)+'</div></div>'+
   '<button class="del" data-del="'+esc(e.id)+'" aria-label="למחוק"><span class="re">🗑️</span>למחוק</button></div>'+
   (askDel===e.id?'<div class="ask"><div class="q">למחוק?</div><button class="yes" data-yes="'+esc(e.id)+'">כן</button><button class="no" data-no="1">לא</button></div>':'')+'</div>';});
 el.innerHTML=h;
}
function deleteEntry(id){
 var a=getDiary(), e=findEntry(a,id); askDel=null; if(!e)return renderEntries();
 e.deleted=true; if(e.synced)e.txt="";   // hidden on this iPad; Niv's sheet keeps its row
 putDiary(a); renderEntries(); syncDiary();
}
// ---- navigation: tap button or swipe sideways ----
document.addEventListener("click",function(e){var id=e.target&&e.target.id;if(id==="tw"){view="week";render();}else if(id==="tdy"){view="day";render();}
 var b=e.target.closest&&e.target.closest("button"); if(!b)return;
 if(b.dataset.task){toggleTask(b.dataset.task);return;}
 if(b.dataset.del){askDel=b.dataset.del;renderEntries();return;}
 if(b.dataset.yes){deleteEntry(b.dataset.yes);return;}
 if(b.dataset.no){askDel=null;renderEntries();return;}
 switch(b.id){
  case "snd":case "snd2":unlockAudio(true);break;
  case "dismiss":dismissAlert();break;
  case "save":saveDiary();break;
  case "showd":showList=!showList;askDel=null;renderEntries();break;
 }
});
var sx=null,sy=null;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",function(e){if(sx==null)return;if(e.target.closest&&e.target.closest("#extras,#alert")){sx=null;return;}var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5){view=view==="day"?"week":"day";render();}sx=null;},{passive:true});
document.addEventListener("touchmove",function(e){if(view==="day"&&document.getElementById("alert").classList.contains("hidden")&&e.target.closest&&e.target.closest("#app"))return;e.preventDefault();},{passive:false}); // day view scrolls down to the checklist/writing area; otherwise no rubber-band
if(q.get("view")==="week")view="week";
window.addEventListener("resize",fit);
document.addEventListener("visibilitychange",function(){if(!document.hidden){loadData();delete WX["_l"+now().date];delete WX[now().date];render();syncDiary();}});
window.addEventListener("online",syncDiary);
// any first tap on the page also unlocks sound (iOS needs a user gesture)
["touchend","click"].forEach(function(ev){document.addEventListener(ev,function(){if(!audioOn())unlockAudio(false);},{passive:true});});
if(sessionStorage.getItem("noam-audio")==="1")unlockAudio(false);
// test hook for automated checks
window.__noam={tasksFor:tasksFor,now:now,getDiary:getDiary,morningState:morningState,audioOn:function(){return audioOn();}};

render(); loadData(); loadWeekWeather(); syncDiary();
setInterval(tick,1000);
setInterval(loadData,5*60e3);
setInterval(function(){var d=now().date;delete WX["_l"+d];loadWeather(d);},30*60e3);
setInterval(loadWeekWeather,3*3600e3);
})();
</script>
